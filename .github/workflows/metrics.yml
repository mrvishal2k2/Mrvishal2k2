# Renders profile stats and streak stats to SVGs committed into this repo.
#
# Why this exists: cards served from shared third-party hosts frequently fail
# or hit GitHub API quotas. This runs on a schedule instead, commits the results,
# and the README points at local files — so nothing is fetched from a third party
# when someone views the profile. It cannot rate-limit.
#
# SETUP (one step, only you can do it):
#   1. Create a classic PAT with the `repo` scope.
#      Giving it `repo` lets the language breakdown and streak stats include
#      PRIVATE repos.
#   2. Add it at Settings → Secrets and variables → Actions → Environments → prod
#      secret, named METRICS_TOKEN.
#   3. Run it from the Actions tab (workflow_dispatch) to generate SVGs.
#
# Note: this only runs once merged to the default branch.

name: Metrics

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    # METRICS_TOKEN lives in the "prod" environment, not in repository secrets.
    # Without this line the job cannot read it and the token arrives empty.
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Render streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          path: assets/streak-stats.svg
          options: "user=Mrvishal2k2&theme=github-dark&date_format=M j[, Y]"

      - name: Render profile metrics
        # Pinned rather than @latest: the runs resolve to v3.34 anyway, and pinning
        # keeps output reproducible instead of shifting under you.
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Mrvishal2k2
          filename: assets/github-metrics.svg
          output_action: none
          template: classic
          base: header, activity, repositories
          config_timezone: Asia/Kolkata   # adjust if wrong

          # Some runs came back with partial GraphQL data — stargazers, forkers,
          # watchers, releases and the language breakdown all zeroed while the repo
          # count stayed correct — and metrics rendered that degraded result and
          # committed it over a good one (522px/53KB dropping to 417px/47KB).
          # Retry rendering instead of accepting the first bad response, and treat
          # plugin errors as fatal so a failed run leaves the previous good SVG in
          # place rather than replacing it.
          retries: 3
          retries_delay: 300
          plugins_errors_fatal: yes

          # Replaces the broken top-languages card.
          # repositories_affiliations + a `repo`-scoped token means private work
          # counts toward the breakdown without exposing a single private repo.
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_details: percentage
          plugin_languages_colors: github

          # Achievements is off. It rendered "unexpected error" both before and
          # after read:org and read:user were added to the PAT, so the cause is not
          # scopes. The trophy card in README.md covers this instead.
          # plugin_achievements: yes

      - name: Commit and push changes
        run: |
          git config user.name "Mrvishal2k2"
          git config user.email "mrvishal2k2@users.noreply.github.com"
          git add assets/github-metrics.svg assets/streak-stats.svg
          git diff --staged --quiet || (git commit -m "Update profile metrics & streak stats [skip ci]" && git push)
